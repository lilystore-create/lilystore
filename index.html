<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moms Cily🌶️♥️ - Sosmed Services</title>
    <style>
        :root {
            --bg-color: #0d0714;
            --card-bg: #1a0b2e;
            --purple-btn: #7c3aed;
            --purple-hover: #6d28d9;
            --purple-glow: rgba(124, 58, 237, 0.4);
            --text-color: #f3e8ff;
            --text-muted: #a78bfa;
            --border-color: #2e1065;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 80px;
        }

        /* Top Header Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn-back {
            background: #2e1065;
            color: #fff;
            border: 1px solid #4c1d95;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .title-header {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: #fff;
            margin-bottom: 20px;
            outline: none;
        }

        /* Platform Selection List */
        .platform-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .platform-btn {
            background: var(--purple-btn);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--purple-glow);
            transition: all 0.2s ease;
        }

        .platform-btn:hover {
            background: var(--purple-hover);
            transform: translateY(-2px);
        }

        /* Category Grid Layout */
        .category-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
            margin: 16px 0 8px 0;
            letter-spacing: 0.5px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            color: #fff;
            transition: 0.2s;
        }

        .item-card:hover {
            border-color: var(--purple-btn);
            box-shadow: 0 0 10px var(--purple-glow);
        }

        /* Quantity Modal / Order Box */
        .order-modal {
            background: var(--card-bg);
            border: 1px solid var(--purple-btn);
            padding: 16px;
            border-radius: 16px;
            margin-top: 15px;
        }

        .input-qty {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }

        .btn-add-cart {
            width: 100%;
            background: #22c55e;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Cart Drawer Sticky Footer */
        .cart-sticky {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #1e1b4b;
            border-top: 2px solid var(--purple-btn);
            padding: 14px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 6px;
            background: var(--bg-color);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .btn-delete {
            color: #ef4444;
            background: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }

        .btn-wa-checkout {
            width: 100%;
            background: #25d366;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- PLATFORM SELECTOR VIEW -->
    <div id="view-platforms">
        <div class="title-header">📊 Sosmed Services</div>
        <input type="text" class="search-box" placeholder="🔍 Cari layanan sosmed...">
        
        <div class="platform-list">
            <button class="platform-btn" onclick="openPlatform('TikTok Services')">🎵 TikTok Services</button>
            <button class="platform-btn" onclick="openPlatform('Instagram Services')">📸 Instagram Services</button>
            <button class="platform-btn" onclick="openPlatform('Facebook Services')">📘 Facebook Services</button>
            <button class="platform-btn" onclick="openPlatform('Telegram Services')">✈️ Telegram Services</button>
            <button class="platform-btn" onclick="openPlatform('YouTube Services')">▶️ YouTube Services</button>
            <button class="platform-btn" onclick="openPlatform('X Services')">🛒 X Services</button>
        </div>
    </div>

    <!-- SERVICES CATEGORY VIEW -->
    <div id="view-services" class="hidden">
        <div class="top-nav">
            <button class="btn-back" onclick="goBack()">← Kembali</button>
        </div>
        <div class="title-header" id="platform-title">🎵 TikTok Services</div>

        <div class="category-title">👥 FOLLOWERS</div>
        <div class="services-grid">
            <div class="item-card" onclick="selectService('TikTok Followers Indonesia', 30000)">🇲🇨 Indonesia</div>
            <div class="item-card" onclick="selectService('TikTok Followers Premium Indo', 80000)">💎 Premium Indo</div>
            <div class="item-card" onclick="selectService('TikTok Followers Luar Negeri', 15000)">🌍 Luar Negeri</div>
            <div class="item-card" onclick="selectService('TikTok Followers Premium Luar', 30000)">💎 Premium Luar</div>
        </div>

        <div class="category-title">❤️ LIKES</div>
        <div class="services-grid">
            <div class="item-card" onclick="selectService('TikTok Likes Basa', 6000)">🇲🇨 Biasa</div>
            <div class="item-card" onclick="selectService('TikTok Likes Premium', 10000)">💎 Premium</div>
            <div class="item-card" onclick="selectService('TikTok Likes Luar Negeri', 4000)">🌍 Luar Negeri</div>
        </div>

        <div class="category-title">👁️ VIEWS</div>
        <div class="services-grid">
            <div class="item-card" onclick="selectService('TikTok Views Standar', 2500)">⚡ Standar</div>
            <div class="item-card" onclick="selectService('TikTok Views Premium', 3500)">💎 Premium</div>
        </div>

        <!-- POPUP INPUT QUANTITY -->
        <div id="qty-box" class="order-modal hidden">
            <div style="font-weight: bold;" id="selected-service-name">Nama Layanan</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="selected-service-price">Harga: Rp 0 / 1.000</div>
            <input type="number" id="input-qty-val" class="input-qty" placeholder="Masukkan jumlah (misal: 100)" oninput="calcPrice()">
            <div style="margin-bottom: 10px; font-weight: bold; color: #38bdf8;" id="total-price-preview">Total: Rp 0</div>
            <button class="btn-add-cart" onclick="addToCart()">+ Tambah ke Keranjang</button>
        </div>
    </div>

    <!-- STICKY CART FOOTER -->
    <div id="cart-footer" class="cart-sticky hidden">
        <div style="font-weight: bold; margin-bottom: 8px;">🛒 Keranjang Belanja Moms Cily 🌶️♥️</div>
        <div id="cart-items-list"></div>
        <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 8px;">
            <span>Total Bayar:</span>
            <span id="grand-total" style="color: #22c55e;">Rp 0</span>
        </div>
        <button class="btn-wa-checkout" onclick="checkoutWA()">📲 Order via WhatsApp</button>
    </div>

</div>

<script>
    let cart = [];
    let activeService = { name: '', pricePerThousand: 0 };

    function openPlatform(name) {
        document.getElementById('view-platforms').classList.add('hidden');
        document.getElementById('view-services').classList.remove('hidden');
        document.getElementById('platform-title').innerText = name;
    }

    function goBack() {
        document.getElementById('view-services').classList.add('hidden');
        document.getElementById('view-platforms').classList.remove('hidden');
    }

    function selectService(name, pricePerThousand) {
        activeService = { name, pricePerThousand };
        document.getElementById('selected-service-name').innerText = name;
        document.getElementById('selected-service-price').innerText = `Harga: Rp ${pricePerThousand.toLocaleString('id-ID')} / 1.000 unit`;
        document.getElementById('input-qty-val').value = '';
        document.getElementById('total-price-preview').innerText = 'Total: Rp 0';
        document.getElementById('qty-box').classList.remove('hidden');
    }

    function calcPrice() {
        let qty = parseInt(document.getElementById('input-qty-val').value) || 0;
        let total = (qty / 1000) * activeService.pricePerThousand;
        document.getElementById('total-price-preview').innerText = `Total: Rp ${Math.round(total).toLocaleString('id-ID')}`;
    }

    function addToCart() {
        let qty = parseInt(document.getElementById('input-qty-val').value) || 0;
        if (qty <= 0) return alert('Masukkan jumlah pemesanan terlebih dahulu!');

        let itemTotal = (qty / 1000) * activeService.pricePerThousand;
        cart.push({ name: activeService.name, qty: qty, total: Math.round(itemTotal) });

        document.getElementById('qty-box').classList.add('hidden');
        renderCart();
    }

    function deleteCartItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function renderCart() {
        let cartListEl = document.getElementById('cart-items-list');
        let cartFooterEl = document.getElementById('cart-footer');
        cartListEl.innerHTML = '';

        if (cart.length === 0) {
            cartFooterEl.classList.add('hidden');
            return;
        }

        cartFooterEl.classList.remove('hidden');
        let grandTotal = 0;

        cart.forEach((item, index) => {
            grandTotal += item.total;
            cartListEl.innerHTML += `
                <div class="cart-item">
                    <span>${item.name} (${item.qty} unit)</span>
                    <div>
                        <span>Rp ${item.total.toLocaleString('id-ID')}</span>
                        <button class="btn-delete" onclick="deleteCartItem(${index})">✕</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('grand-total').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
    }

    function checkoutWA() {
        if (cart.length === 0) return;

        let text = "Halo Admin Moms Cily 🌶️♥️, Saya mau order Sosmed Services:\n\n";
        let grandTotal = 0;

        cart.forEach((item, index) => {
            text += `${index + 1}. ${item.name}\n   • Jumlah: ${item.qty} unit\n   • Subtotal: Rp ${item.total.toLocaleString('id-ID')}\n`;
            grandTotal += item.total;
        });

        text += `\n*Total Bayar: Rp ${grandTotal.toLocaleString('id-ID')}*`;
        
        let waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
    }
</script>

</body>
</html>
